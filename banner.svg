<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="Abhishek Singh, Founding Engineer. AI agents, RAG and evaluation.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="0.55" stop-color="#0f1b3a"/>
      <stop offset="1" stop-color="#16295c"/>
    </linearGradient>
    <linearGradient id="name" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#93c5fd"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.85" cy="0.1" r="0.7">
      <stop offset="0" stop-color="#327cf6" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#327cf6" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1.1" fill="#ffffff" fill-opacity="0.07"/>
    </pattern>
  </defs>
  <rect width="1200" height="300" rx="20" fill="url(#bg)"/>
  <rect width="1200" height="300" rx="20" fill="url(#dots)"/>
  <rect width="1200" height="300" rx="20" fill="url(#glow)"/>

  <!-- agent graph motif -->
  <g stroke="#60a5fa" stroke-opacity="0.45" stroke-width="2" fill="none">
    <path d="M880 70 C 940 70, 940 150, 1000 150"/>
    <path d="M880 230 C 940 230, 940 150, 1000 150"/>
    <path d="M1000 150 C 1060 150, 1060 90, 1120 90"/>
    <path d="M1000 150 C 1060 150, 1060 210, 1120 210"/>
  </g>
  <g fill="#0b1220" stroke="#60a5fa" stroke-width="2">
    <rect x="840" y="52" width="64" height="36" rx="10"/>
    <rect x="840" y="212" width="64" height="36" rx="10"/>
    <rect x="970" y="130" width="64" height="40" rx="11" fill="#1d4ed8" stroke="#93c5fd"/>
    <rect x="1096" y="72" width="64" height="36" rx="10"/>
    <rect x="1096" y="192" width="64" height="36" rx="10"/>
  </g>
  <g fill="#bfdbfe" font-family="'JetBrains Mono','SFMono-Regular',Consolas,monospace" font-size="12" text-anchor="middle">
    <text x="872" y="75">tool</text>
    <text x="872" y="235">rag</text>
    <text x="1002" y="155" fill="#ffffff" font-weight="700">LLM</text>
    <text x="1128" y="95">judge</text>
    <text x="1128" y="215">trace</text>
  </g>

  <g font-family="'Segoe UI',-apple-system,BlinkMacSystemFont,Helvetica,Arial,sans-serif">
    <text x="64" y="118" font-size="64" font-weight="800" fill="url(#name)" letter-spacing="-1.5">Abhishek Singh</text>
    <text x="66" y="168" font-size="26" font-weight="600" fill="#dbeafe">Founding Engineer</text>
    <text x="66" y="204" font-size="19" fill="#93a8d6">AI agents · RAG · LLM evaluation · production systems</text>
  </g>
  <g font-family="'Segoe UI',-apple-system,Helvetica,Arial,sans-serif" font-size="14" font-weight="600">
    <rect x="66" y="228" width="108" height="30" rx="15" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.18"/>
    <text x="120" y="248" fill="#e2e8f0" text-anchor="middle">Tracelyst</text>
    <rect x="184" y="228" width="108" height="30" rx="15" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.18"/>
    <text x="238" y="248" fill="#e2e8f0" text-anchor="middle">LangGraph</text>
    <rect x="302" y="228" width="76" height="30" rx="15" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.18"/>
    <text x="340" y="248" fill="#e2e8f0" text-anchor="middle">MCP</text>
    <rect x="388" y="228" width="92" height="30" rx="15" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.18"/>
    <text x="434" y="248" fill="#e2e8f0" text-anchor="middle">Python</text>
    <rect x="490" y="228" width="104" height="30" rx="15" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.18"/>
    <text x="542" y="248" fill="#e2e8f0" text-anchor="middle">Next.js</text>
  </g>
</svg>
